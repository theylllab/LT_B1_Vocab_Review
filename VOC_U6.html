<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高頻單字 U6</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fcf9f2;
      color: #333;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      min-width: 800px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
      vertical-align: top;
    }
    th {
      background-color: #f0e6d2;
      font-weight: bold;
      color: #5a4a42;
    }
    .word-cell {
      font-size: 1.2em;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .syl-1 { color: #d32f2f; }
    .syl-2 { color: #1976d2; }
    .syl-3 { color: #388e3c; }
    .syl-4 { color: #f57c00; }
    .syl-5 { color: #7b1fa2; }
    .separator {
      color: #b0bec5;
      margin: 0 2px;
      font-weight: normal;
    }
    .phrase-text {
      color: #1565c0;
    }
    .btn-audio {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      padding: 3px 8px;
      margin-left: 6px;
      font-size: 0.85em;
      transition: background 0.2s;
    }
    .btn-audio:hover {
      background-color: #f0f0f0;
    }
    .kk-text {
      color: #555;
      font-family: Arial, sans-serif;
      white-space: nowrap;
    }
    .meaning-text {
      color: #333;
    }
    .pos-text {
      color: #777;
      font-style: italic;
      margin-right: 5px;
    }
    .sentence-text {
      color: #1a5276;
      font-size: 0.9em;
      line-height: 1.4;
    }
    .sentence-text b {
      color: #0d47a1;
      font-weight: bold;
    }
    .mnemonic-text {
      font-size: 0.9em;
      line-height: 1.5;
      color: #4a4a4a;
    }
    .mnemonic-tag {
      display: inline-block;
      background-color: #e8f5e9;
      color: #2e7d32;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85em;
      margin-right: 5px;
      font-weight: bold;
    }
    .mnemonic-tag.sound {
      background-color: #fff3e0;
      color: #ef6c00;
    }
    .mnemonic-tag.creative {
      background-color: #e3f2fd;
      color: #1565c0;
    }
    .section-title {
      background-color: #bbdefb;
      color: #0d47a1;
      font-size: 1.2em;
      font-weight: bold;
      text-align: center;
      padding: 15px;
      letter-spacing: 2px;
    }

    /* 手機螢幕 RWD 自適應卡片樣式 */
    @media (max-width: 768px) {
      body {
        padding: 10px 8px;
      }
      h2 {
        font-size: 1.25rem;
        margin: 10px 4px;
        text-align: center;
      }
      .table-wrapper {
        box-shadow: none;
        overflow-x: visible;
      }
      table {
        min-width: 100% !important;
        display: block;
      }
      thead {
        display: none;
      }
      tbody, tr, td {
        display: block;
        width: 100%;
        box-sizing: border-box;
      }
      tr {
        background: #ffffff;
        margin-bottom: 12px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        border: 1px solid #ebe5d8;
        padding: 12px;
      }
      td {
        border-bottom: none;
        padding: 4px 0;
      }
      td.col-id {
        display: inline-block;
        background-color: #f0e6d2;
        color: #795548;
        font-size: 0.75rem;
        font-weight: bold;
        padding: 2px 8px;
        border-radius: 12px;
        margin-bottom: 4px;
      }
      td.col-word {
        font-size: 1.3em;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }
      td.col-kk {
        font-size: 0.9em;
        color: #666;
        padding-bottom: 6px;
      }
      td.col-meaning {
        font-size: 1.05em;
        color: #212121;
        font-weight: 500;
        padding-bottom: 8px;
        border-bottom: 1px dashed #eee;
      }
      .section-title {
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 1.05em;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📖 Vocabulary List</h2>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th width="5%">序號</th>
          <th width="18%">單字 / 片語</th>
          <th width="12%">KK音標</th>
          <th width="15%">中文意思</th>
          <th width="25%">記憶法 / 備註</th>
          <th width="25%">英文例句</th>
        </tr>
      </thead>
      <tbody id="word-list"></tbody>
      <tbody><tr><td colspan="6" class="section-title">✨ Idioms and Phrases ✨</td></tr></tbody>
      <tbody id="phrase-list"></tbody>
    </table>
  </div>
</div>

<script>
  const allData = [
    { "單字": "associated", "詞性": "adj.", "KK音標": "[ə`soʃɪˌetɪd]", "音節": ["as", "so", "ci", "at", "ed"], "中文意思": "相關的", "例句": "Mitch wants to find a job that is associated with design.", "記憶法": "[字根記法] as (朝向) + soci (同伴) + ated -> 被關聯起來的" },
    { "單字": "badly", "詞性": "adv.", "KK音標": "[`bædlɪ]", "音節": ["bad", "ly"], "中文意思": "非常地；拙劣地", "例句": "By the end of the long class, Charlie badly needed to find the bathroom.", "記憶法": "[字根記法] bad (壞的) + ly (副詞) -> 極其(糟糕地)" },
    { "單字": "conclusion", "詞性": "n. [C]", "KK音標": "[kən`kluʒən]", "音節": ["con", "clu", "sion"], "中文意思": "結論；推論", "例句": "Thinking about his future, Ian reached the conclusion that he wanted to be a pilot.", "記憶法": "[字根記法] con (一起) + clud (關閉) + sion -> 全部結束關閉 -> 結論" },
    { "單字": "deposit", "詞性": "n. [C], vt.", "KK音標": "[dɪ`pɑzɪt]", "音節": ["de", "pos", "it"], "中文意思": "礦床；押金；存款；沉積", "例句": "Steve had to pay a deposit on the expensive car.", "記憶法": "[字根記法] de (向下) + pos (放) + it -> 放下去 -> 存放/沉澱" },
    { "單字": "fatal", "詞性": "adj.", "KK音標": "[`fetḷ]", "音節": ["fa", "tal"], "中文意思": "致命的", "例句": "Thankfully, Will's illness was not fatal.", "記憶法": "[字根記法] fate (命運) + al (形容詞) -> 命運終結的 -> 致命的" },
    { "單字": "fiber", "詞性": "n. [U, C]", "KK音標": "[`faɪbɚ]", "音節": ["fi", "ber"], "中文意思": "(食物)纖維；織物", "例句": "Snacking on fruit and nuts is a good way to get enough fiber in your diet.", "記憶法": "[創意記法] 植物或布料中的細絲(fiber)" },
    { "單字": "fluid", "詞性": "n. [C, U], adj.", "KK音標": "[`fluɪd]", "音節": ["flu", "id"], "中文意思": "液體；流暢的", "例句": "You should drink plenty of fluids when you are sick.", "記憶法": "[字根記法] flu (流動) + id -> 流動的物質" },
    { "單字": "harm", "詞性": "vt., n. [U]", "KK音標": "[hɑrm]", "音節": ["harm"], "中文意思": "傷害；危害；損害", "例句": "Eating a little candy won't harm your teeth.", "記憶法": "[創意記法] 破壞(harm)原本完好的狀態" },
    { "單字": "leak", "詞性": "vi., vt., n. [C]", "KK音標": "[lik]", "音節": ["leak"], "中文意思": "滲漏；洩漏；裂縫", "例句": "Rain leaked through the roof and flooded Pam's kitchen.", "記憶法": "[諧音記法] 裂口(leak) -> 水從裂口漏出來" },
    { "單字": "lighten", "詞性": "vt., vi.", "KK音標": "[`laɪtṇ]", "音節": ["light", "en"], "中文意思": "減輕；變淡；變亮", "例句": "The teacher lightened the difficult math problem by solving it on the blackboard.", "記憶法": "[字根記法] light (輕的/亮的) + en (使) -> 使減輕/使變亮" },
    { "單字": "lung", "詞性": "n. [C]", "KK音標": "[lʌŋ]", "音節": ["lung"], "中文意思": "肺", "例句": "Birds and mammals use their lungs to breathe.", "記憶法": "[創意記法] 呼吸空氣(lung)進入體內" },
    { "單字": "mineral", "詞性": "n. [C]", "KK音標": "[`mɪnərəl]", "音節": ["min", "er", "al"], "中文意思": "礦物質；礦物", "例句": "This natural spring water contains many healthy minerals.", "記憶法": "[字根記法] mine (礦) + eral -> 礦物" },
    { "單字": "modest", "詞性": "adj.", "KK音標": "[`mɑdɪst]", "音節": ["mod", "est"], "中文意思": "不大的；謙虛的；端莊的", "例句": "Even though John is so famous, he is modest.", "記憶法": "[字根記法] mod (模式/適度) + est -> 保持適度的 -> 謙虛/不大的" },
    { "單字": "overdo", "詞性": "vt.", "KK音標": "[ˌovɚ`du]", "音節": ["o", "ver", "do"], "中文意思": "把...做得過多；做得過火", "例句": "Spices add to the flavor of the soup, but you shouldn't overdo it.", "記憶法": "[字根記法] over (超過) + do (做) -> 做過頭" },
    { "單字": "physician", "詞性": "n. [C]", "KK音標": "[fə`zɪʃən]", "音節": ["phy", "si", "cian"], "中文意思": "(內科)醫生", "例句": "Old people should always ask their physician before starting any kind of exercise.", "記憶法": "[字根記法] physi (自然/身體) + cian (專家) -> 治療身體的專家" },
    { "單字": "shortage", "詞性": "n. [C]", "KK音標": "[`ʃɔrtɪdʒ]", "音節": ["short", "age"], "中文意思": "缺少；短缺", "例句": "Cities all over the world have been experiencing water shortages.", "記憶法": "[字根記法] short (短/缺) + age (名詞) -> 短缺" },
    { "單字": "swell", "詞性": "vi., vt.", "KK音標": "[swɛl]", "音節": ["swell"], "中文意思": "腫脹；增強；增加", "例句": "When Gina hurt her ankle, it swelled to twice the normal size and turned purple.", "記憶法": "[諧音記法] 史威爾(swell) -> 威爾的腳腫起來了" },
     ];

  try {
    const wordsData = allData.filter(item => !(item.詞性 && item.詞性.includes('phr')));
    const phrasesData = allData.filter(item => item.詞性 && item.詞性.includes('phr'));

    wordsData.sort((a, b) => a.單字.localeCompare(b.單字));
    phrasesData.sort((a, b) => a.單字.localeCompare(b.單字));

    const wordList = document.getElementById('word-list');
    const phraseList = document.getElementById('phrase-list');
    let globalIndex = 1;

    function createRow(item) {
      const tr = document.createElement('tr');
      
      const word = item.單字 || item.word || item.Vocab || "";
      const kk = item.KK音標 || item.kk || item.KK || "";
      const pos = item.詞性 || item.pos || item.POS || "";
      const meaning = item.中文意思 || item.meaning || item.Chinese || "";
      let mnemonic = item.記憶法 || item.mnemonic || item.Mnemonic || "";
      const sentence = item.例句 || item.sentence || item.Example || "";
      const syllables = item.音節 || item.syllables || item.Syllables || [];

      let syllablesHtml = '';
      if (Array.isArray(syllables) && syllables.length > 0) {
        syllables.forEach((syl, i) => {
          let colorClass = `syl-${(i % 5) + 1}`; 
          syllablesHtml += `<span class="${colorClass}">${syl}</span>`;
          if (i < syllables.length - 1) {
            syllablesHtml += `<span class="separator">·</span>`;
          }
        });
      } else {
        syllablesHtml = `<span class="phrase-text">${word}</span>`;
      }

      let posHtml = pos ? `<span class="pos-text">${pos}</span>` : '';

      if (mnemonic.includes('[字根記法]')) {
        mnemonic = mnemonic.replace('[字根記法]', '<span class="mnemonic-tag">字根</span>');
      } else if (mnemonic.includes('[諧音記法]')) {
        mnemonic = mnemonic.replace('[諧音記法]', '<span class="mnemonic-tag sound">諧音</span>');
      } else if (mnemonic.includes('[創意記法]')) {
        mnemonic = mnemonic.replace('[創意記法]', '<span class="mnemonic-tag creative">創意</span>');
      }

      let highlightedSentence = sentence;
      if (highlightedSentence && word) {
        try {
          const targetWord = word.trim().split(/\s+/)[0]; 
          const escapedWord = targetWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const wordRegex = new RegExp(`\\b(${escapedWord}[a-zA-Z]*)\\b`, 'gi');
          highlightedSentence = highlightedSentence.replace(wordRegex, '<b>$1</b>');
        } catch (err) {
          highlightedSentence = sentence;
        }
      }

      tr.innerHTML = `
        <td class="col-id">#${globalIndex++}</td>
        <td class="word-cell col-word">
          ${syllablesHtml}
          <button class="btn-audio play-word" data-text="${word}" title="發音">🔊</button>
        </td>
        <td class="kk-text col-kk">${kk}</td>
        <td class="meaning-text col-meaning">${posHtml}${meaning}</td>
        <td class="mnemonic-text col-mnemonic">${mnemonic}</td>
        <td class="sentence-text col-sentence">
          ${highlightedSentence} 
          ${sentence ? `<button class="btn-audio play-sentence" data-text="${sentence}" title="例句發音">🔊</button>` : ''}
        </td>
      `;
      return tr;
    }

    wordsData.forEach(item => { wordList.appendChild(createRow(item)); });
    phrasesData.forEach(item => { phraseList.appendChild(createRow(item)); });

        // --- 手機版原生同步語音引擎 (Web Speech API) ---
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('play-word')) {
        speakText(e.target.getAttribute('data-text'), 0.9);
      } else if (e.target.classList.contains('play-sentence')) {
        speakText(e.target.getAttribute('data-text'), 1.0);
      }
    });

    function speakText(text, rate) {
      if (!text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text.split('...').join(' '));
      utterance.lang = 'en-US';
      utterance.rate = rate;
      window.speechSynthesis.speak(utterance);
    }

  } catch (error) {
    alert("執行發生錯誤：" + error);
  }
</script>
</body>
</html>
