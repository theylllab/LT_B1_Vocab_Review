<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文單字與片語複習首頁</title>
  <style>
    /* =====================
       電腦版預設樣式
       ===================== */
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fcf9f2;
      color: #333;
      padding: 40px 20px 60px;
      margin: 0;
      text-align: center;
      box-sizing: border-box;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    h1 {
      color: #5a4a42;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
    .intro-text {
      color: #666;
      margin-bottom: 30px;
      font-size: 1rem;
    }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }
    
    /* 主按鈕樣式 */
    .tab-link {
      display: inline-block;
      width: 80%;
      max-width: 400px;
      padding: 15px 20px;
      background-color: #f0e6d2;
      color: #5a4a42;
      text-decoration: none;
      font-size: 1.15em;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      box-sizing: border-box;
      cursor: pointer;
      font-family: inherit;
    }
    .tab-link:hover {
      background-color: #e6d8be;
      border: 2px solid #c8b493;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .tab-link:active {
      transform: translateY(0);
    }

    /* 子選單與子按鈕樣式 */
    .sub-menu {
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      align-items: center;
      margin-top: -5px;
      margin-bottom: 15px;
    }
    .sub-link {
      background-color: #f8f1e4;
      width: 75%;
      max-width: 350px;
      font-size: 1.05em;
      padding: 12px 18px;
    }
    .sub-link:hover {
      background-color: #efe3ce;
      border-color: #d6c6ad;
    }

    /* 下方中間：總瀏覽人次樣式 */
    .footer-counter {
      margin-top: 30px;
      padding-bottom: 10px;
      text-align: center;
      color: #5a4a42;
      font-size: 0.95rem;
    }
    #busuanzi_value_site_uv {
      color: #000000; /* 純黑色數字 */
      font-weight: bold;
      font-size: 1.1rem;
      margin: 0 4px;
    }

    /* 最右下角固定文字：LYGSHYL */
    .corner-signature {
      position: fixed;
      right: 16px;
      bottom: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #8c7b70;
      letter-spacing: 1px;
      user-select: none;
      z-index: 999;
    }

    /* =========================================================
       手機螢幕自適應排版（螢幕寬度 768px 以下自動生效）
       ========================================================= */
    @media (max-width: 768px) {
      body {
        padding: 20px 12px 50px;
      }
      .container {
        padding: 24px 16px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      }
      h1 {
        font-size: 1.35rem;
        margin-bottom: 15px;
        letter-spacing: 1px;
      }
      .intro-text {
        font-size: 0.9rem;
        margin-bottom: 20px;
      }
      .menu {
        gap: 12px;
      }
      .tab-link {
        width: 100%;
        max-width: none;
        font-size: 1.05em;
        padding: 14px 16px;
      }
      .sub-link {
        width: 90%;
        font-size: 1em;
        padding: 12px 16px;
      }
      .footer-counter {
        margin-top: 24px;
        font-size: 0.9rem;
      }
      .corner-signature {
        right: 10px;
        bottom: 8px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📚 高中英文單字複習</h1>
  <p class="intro-text">請選擇你要複習的單元：</p>
  
  <div class="menu">
    
    <!-- 第二次期中考 (點擊展開) -->
    <button class="tab-link" onclick="toggleMenu('midterm2')">🎯 第二次期中考 ▾</button>
    <div id="midterm2" class="sub-menu">
      <a href="B1L4 VOC.html" class="tab-link sub-link">📖 龍騰 B1L4 單字與片語</a>
      <a href="B1L5 VOC.html" class="tab-link sub-link">📖 龍騰 B1L5 單字與片語</a>
      <a href="B1L6 VOC.html" class="tab-link sub-link">📖 龍騰 B1L6 單字與片語</a>
      <a href="VOC_U3.html" class="tab-link sub-link">📖 高頻單字 U3 單字與片語</a>
      <a href="VOC_U4.html" class="tab-link sub-link">📖 高頻單字 U4 單字與片語</a>
    </div>

    <!-- 期末考 (點擊展開) -->
    <button class="tab-link" onclick="toggleMenu('final')">🏆 期末考 ▾</button>
    <div id="final" class="sub-menu">
      <a href="B1L4 VOC.html" class="tab-link sub-link">📖 龍騰 B1L7 單字與片語</a>
      <a href="B1L5 VOC.html" class="tab-link sub-link">📖 龍騰 B1L8 單字與片語</a>
      <a href="B1L6 VOC.html" class="tab-link sub-link">📖 龍騰 B1L9 單字與片語</a>
      <a href="VOC_U3.html" class="tab-link sub-link">📖 高頻單字 U5 單字與片語</a>
      <a href="VOC_U4.html" class="tab-link sub-link">📖 高頻單字 U6 單字與片語</a>
    </div>
    
  </div>
</div>

<!-- 首頁下方中間：總瀏覽人次（黑色數字，短時間刷新不重複計算） -->
<footer class="footer-counter">
  <span id="busuanzi_container_site_uv">
    總瀏覽人次：<span id="busuanzi_value_site_uv">--</span>
  </span>
</footer>

<!-- 最右下角固定署名 -->
<div class="corner-signature">LYGSHYL</div>

<!-- 防短時間刷新計數腳本 + 不蒜子免費靜態網站計數器 -->
<script>
  (function() {
    const COOLDOWN_MS = 10 * 60 * 1000; // 設定 10 分鐘內重複刷新不重複向伺服器發送計數
    const lastVisit = localStorage.getItem('lygshyl_last_visit');
    const cachedCount = localStorage.getItem('lygshyl_cached_uv');
    const now = Date.now();

    // 若在 10 分鐘內重複刷新且已有快取數字，直接顯示快取數字、不載入計數器腳本
    if (lastVisit && (now - parseInt(lastVisit, 10) < COOLDOWN_MS) && cachedCount) {
      document.addEventListener('DOMContentLoaded', function() {
        const uvSpan = document.getElementById('busuanzi_value_site_uv');
        if (uvSpan) uvSpan.textContent = cachedCount;
      });
    } else {
      // 超過 10 分鐘或首次造訪，載入計數器並更新時間戳記
      localStorage.setItem('lygshyl_last_visit', now.toString());
      const bszScript = document.createElement('script');
      bszScript.async = true;
      bszScript.src = '//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
      document.body.appendChild(bszScript);

      // 監聽數字載入完成後存入快取，供短時間刷新時顯示
      const checkTimer = setInterval(function() {
        const uvSpan = document.getElementById('busuanzi_value_site_uv');
        if (uvSpan && uvSpan.textContent !== '--' && uvSpan.textContent.trim() !== '') {
          localStorage.setItem('lygshyl_cached_uv', uvSpan.textContent.trim());
          clearInterval(checkTimer);
        }
      }, 500);
      setTimeout(() => clearInterval(checkTimer), 10000);
    }
  })();

  // 控制子選單展開與收合的腳本
  function toggleMenu(menuId) {
    const menu = document.getElementById(menuId);
    if (menu.style.display === 'none' || menu.style.display === '') {
      menu.style.display = 'flex';
    } else {
      menu.style.display = 'none';
    }
  }
</script>

</body>
</html>
