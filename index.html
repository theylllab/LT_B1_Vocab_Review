<!-- 【程式區】 -->
<script>
  try {
    const jsonText = document.getElementById('words-json').textContent;
    const allData = JSON.parse(jsonText);
    
    // 把資料拆成兩半：「單字」與「片語」
    const wordsData = allData.filter(item => item.詞性 !== 'phr.');
    const phrasesData = allData.filter(item => item.詞性 === 'phr.');

    // 分別將兩區進行 A 到 Z 排序
    wordsData.sort((a, b) => a.單字.localeCompare(b.單字));
    phrasesData.sort((a, b) => a.單字.localeCompare(b.單字));

    const wordList = document.getElementById('word-list');
    const phraseList = document.getElementById('phrase-list');

    let globalIndex = 1; // 讓序號可以連續往下編排

    // 畫出表格列的共用函式
    function createRow(item) {
      const tr = document.createElement('tr');
      
      let syllablesHtml = '';
      const syllables = item.音節 || [];
      
      if (syllables.length > 0) {
        // 單字處理：切換顏色
        syllables.forEach((syl, i) => {
          let colorClass = `syl-${(i % 5) + 1}`; 
          syllablesHtml += `<span class="${colorClass}">${syl}</span>`;
          if (i < syllables.length - 1) {
            syllablesHtml += `<span class="separator">·</span>`;
          }
        });
      } else {
        // 片語處理：整組變藍色
        syllablesHtml = `<span class="phrase-text">${item.單字}</span>`;
      }

      let posHtml = item.詞性 ? `<span class="pos-text">${item.詞性}</span>` : '';

      let mnemonic = item.記憶法 || "";
      if (mnemonic.includes('[字根記法]')) {
        mnemonic = mnemonic.replace('[字根記法]', '<span class="mnemonic-tag">字根</span>');
      } else if (mnemonic.includes('[諧音記法]')) {
        mnemonic = mnemonic.replace('[諧音記法]', '<span class="mnemonic-tag sound">諧音</span>');
      } else if (mnemonic.includes('[創意記法]')) {
        mnemonic = mnemonic.replace('[創意記法]', '<span class="mnemonic-tag creative">創意</span>');
      }

      tr.innerHTML = `
        <td>${globalIndex++}</td>
        <td class="word-cell">
          ${syllablesHtml}
          <button class="btn-audio play-word" data-text="${item.單字}" title="發音">🔊</button>
        </td>
        <td class="kk-text">${item.KK音標}</td>
        <td class="meaning-text">${posHtml}${item.中文意思}</td>
        <td class="mnemonic-text">${mnemonic}</td>
        <td class="sentence-text">
          ${item.例句} 
          <button class="btn-audio play-sentence" data-text="${item.例句}" title="例句發音">🔊</button>
        </td>
      `;
      return tr;
    }

    // 1. 渲染單字區
    wordsData.forEach(item => {
      wordList.appendChild(createRow(item));
    });

    // 2. 渲染片語區
    phrasesData.forEach(item => {
      phraseList.appendChild(createRow(item));
    });

    // 綁定發音事件
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('play-word')) {
        speakText(e.target.getAttribute('data-text'), 0.9);
      } else if (e.target.classList.contains('play-sentence')) {
        speakText(e.target.getAttribute('data-text'), 1.0);
      }
    });

    function speakText(text, rate) {
      if (!text) return;
      if (text.split(' ').length > 2 && text.length > 20) {
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US'; 
        utterance.rate = rate; 
        window.speechSynthesis.speak(utterance);
        return;
      }

      const cleanWord = text.toLowerCase().trim();
      const audioFile = new Audio(`audio/${cleanWord}.mp3`);
      audioFile.play().catch(function(error) {
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = rate;
        window.speechSynthesis.speak(utterance);
      });
    }

  } catch (error) {
    alert("資料載入發生錯誤！請確認這份程式碼是不是有完整「全選、複製、貼上」喔！詳細錯誤：" + error);
  }
</script>
