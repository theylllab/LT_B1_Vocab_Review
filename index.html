    /* =====================
       電腦版預設樣式

    body {

      background-color: #fcf9f2;
      color: #333;
      padding: 40px 20px;
      margin: 0;
      text-align: center;

    }
    .container {
      max-width: 800px;
      margin: 0 auto;

      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);

    h1 {

    }
    .intro-text {

      margin-bottom: 30px;
      font-size: 1rem;
    }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }
    .tab-link {
      display: inline-block;
      width: 80%;
      max-width: 400px;
      padding: 15px 20px;
      background-color: #f0e6d2;
      color: #5a4a42;
      text-decoration: none;
      font-size: 1.15em;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .tab-link:hover {
      background-color: #e6d8be;
      border: 2px solid #c8b493;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .tab-link:active {
      transform: translateY(0);
    }

       【新增】：手機螢幕自適應排版（螢幕寬度 768px 以下自動生效）
       ========================================================= */
    @media (max-width: 768px) {
      body {
        padding: 20px 12px; /* 縮減邊距，留給內容更多空間 */
      }
      .container {
        padding: 24px 16px; /* 減少白色卡片內距，避免畫面太長 */
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      }
      h1 {
        font-size: 1.35rem; /* 標題縮小，防止手機上拆成多行 */
        margin-bottom: 15px;
        letter-spacing: 1px;
      }
      .intro-text {
        font-size: 0.9rem;
        margin-bottom: 20px;
      }
      .menu {
        gap: 12px; /* 按鈕之間的間隔微調 */
      }
      .tab-link {
        width: 100%; /* 按鈕在手機上撐滿卡片，更好點擊 */
        max-width: none;
        font-size: 1.05em;
        padding: 14px 16px;
      }
    }
