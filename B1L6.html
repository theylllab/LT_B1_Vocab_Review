      const meaning = item.中文意思 || item.meaning || item.Chinese || "";
      let mnemonic = item.記憶法 || item.mnemonic || item.Mnemonic || "";
      const sentence = item.例句 || item.sentence || item.Example || "";
      const syllables = item.音節 || item.syllables || item.Syllables || [];

      let syllablesHtml = '';
      if (Array.isArray(syllables) && syllables.length > 0) {
        syllables.forEach((syl, i) => {
          let colorClass = `syl-${(i % 5) + 1}`; 
          syllablesHtml += `<span class="${colorClass}">${syl}</span>`;
          if (i < syllables.length - 1) {
            syllablesHtml += `<span class="separator">·</span>`;
          }
        });
      } else {
        syllablesHtml = `<span class="phrase-text">${word}</span>`;
      }

      let posHtml = pos ? `<span class="pos-text">${pos}</span>` : '';

      if (mnemonic.includes('[字根記法]')) {
        mnemonic = mnemonic.replace('[字根記法]', '<span class="mnemonic-tag">字根</span>');
      } else if (mnemonic.includes('[諧音記法]')) {
        mnemonic = mnemonic.replace('[諧音記法]', '<span class="mnemonic-tag sound">諧音</span>');
      } else if (mnemonic.includes('[創意記法]')) {
        mnemonic = mnemonic.replace('[創意記法]', '<span class="mnemonic-tag creative">創意</span>');
      }

      // 例句單字粗體化（安全不崩潰處理）
      let highlightedSentence = sentence;
      if (sentence && word) {
        try {
          const target = word.trim().split(" ")[0]; // 若為片語先抓第一個核心字或全字
          const reg = new RegExp(`\\b(${target}[a-zA-Z]*)\\b`, 'gi');
          highlightedSentence = sentence.replace(reg, '<b>$1</b>');
        } catch (err) {
          highlightedSentence = sentence;
        }
      }

      tr.innerHTML = `
        <td class="col-id">#${globalIndex++}</td>
        <td class="word-cell col-word">
          ${syllablesHtml}
          <button class="btn-audio play-word" data-text="${word}" title="發音">🔊</button>
        </td>
        <td class="kk-text col-kk">${kk}</td>
        <td class="meaning-text col-meaning">${posHtml}${meaning}</td>
        <td class="mnemonic-text col-mnemonic">${mnemonic}</td>
        <td class="sentence-text col-sentence">
          ${highlightedSentence} 
          ${sentence ? `<button class="btn-audio play-sentence" data-text="${sentence}" title="例句發音">🔊</button>` : ''}
        </td>
      `;
      return tr;
    }

    // 1. 渲染單字區
    wordsData.forEach(item => {
      wordList.appendChild(createRow(item));
    });

    // 2. 渲染片語區
    phrasesData.forEach(item => {
      phraseList.appendChild(createRow(item));
    });

    // 點擊事件監聽
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('play-word')) {
        speakText(e.target.getAttribute('data-text'), 0.9);
      } else if (e.target.classList.contains('play-sentence')) {
        speakText(e.target.getAttribute('data-text'), 1.0);
      }
    });

    let currentAudio = null;

    function speakText(text, rate) {
      if (!text) return;

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      window.speechSynthesis.cancel();

      // Google Translate TTS 介面
      const encodedText = encodeURIComponent(text.replace(/\.\.\./g, ' '));
      const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&q=${encodedText}`;
      
      currentAudio = new Audio(googleTtsUrl);
      currentAudio.playbackRate = rate;

      currentAudio.onerror = function() {
        fallbackToSpeech(text, rate);
      };

      currentAudio.play().catch(function() {
        fallbackToSpeech(text, rate);
      });
    }

    function fallbackToSpeech(text, rate) {
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text.replace(/\.\.\./g, ' '));
      utterance.lang = 'en-US';
      utterance.rate = rate;
      window.speechSynthesis.speak(utterance);
    }

  } catch (error) {
    alert("執行發生錯誤：" + error);
  }
</script>

</body>
</html>
